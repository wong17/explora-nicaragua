<nav
  class="navbar navbar-expand-lg fixed-top custom-navbar"
  [class.scrolled]="isScrolled()"
  [class.mobile-open]="isMenuOpen()"
>
  <div class="container">
    <a class="navbar-brand text-white fw-bold d-flex align-items-center gap-2" routerLink="/">
      <i class="fa-solid fa-location-dot text-accent fs-4"></i>
      <span class="brand-text"> Explora <span class="text-accent">Nicaragua</span> </span>
    </a>

    <button
      class="navbar-toggler border-0 text-white shadow-none"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen()"
    >
      <i class="fa-solid fa-bars fs-3"></i>
    </button>

    <div class="collapse navbar-collapse" [class.show]="isMenuOpen()">
      <ul class="navbar-nav ms-auto align-items-center gap-lg-4 gap-3 py-3 py-lg-0">
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeMenu()"
          >
            Inicio
          </a>
        </li>

        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/destinos"
            routerLinkActive="active"
            (click)="closeMenu()"
          >
            Destinos
          </a>
        </li>

        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/favoritos"
            routerLinkActive="active"
            (click)="closeMenu()"
          >
            Mis Favoritos
          </a>
        </li>

        <li class="nav-item ms-lg-3">
          <a routerLink="/login" class="btn btn-login px-4 rounded-pill" (click)="closeMenu()">
            Acceder
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>
